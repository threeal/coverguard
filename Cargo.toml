[package]
name = "coverguard"
version = "0.1.0"
authors = ["Alfi Maulana <alfi.maulana.f@gmail.com>"]
categories = ["command-line-utilities", "development-tools::testing"]
edition = "2024"
keywords = ["coverage", "code-coverage", "llvm-cov", "threshold", "ci"]
license = "MIT"
repository = "https://github.com/threeal/coverguard"
rust-version = "1.100"
description = "Enforce coverage thresholds on the reports your tests already write"

[dependencies]
clap = "4.6.8"
globset = "0.4.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.cargo]
default = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[lints.rust]
warnings = "deny"
missing_docs = "deny"
